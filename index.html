<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AyoBangun Contractor</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<img src="assets/logo-ayo-bangun.jpeg">
<h1>AyoBangun Contractor</h1>
<p>Construction Project Management System</p>
</header>
<main>
<section class="dashboard">
<div>Project Aktif<h2 id="project">0</h2></div>
<div>Material Kritis<h2 id="critical">0</h2></div>
<div>Tenaga Hari Ini<h2 id="workers">0</h2></div>
<div>Progress<h2 id="progress">0%</h2></div>
</section>

<nav>
<button onclick="show('project')">Project</button>
<button onclick="show('material')">Material</button>
<button onclick="show('worker')">Pekerja</button>
<button onclick="show('report')">Laporan</button>
</nav>

<div id="content"></div>
</main>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
